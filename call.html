<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Book a Call</title>
<meta name="description" content="Tell us a bit about your business and we'll call you back.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="icon" href="assets/sox-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="index.html"><img class="mark" src="assets/sox-icon.svg" alt="" width="28" height="28"><span data-cfg="businessName">SOX Management</span></a>
  <nav class="nav" aria-label="Main"><a class="btn btn-ghost" href="index.html">Back to site</a></nav>
</div></header>
<main class="start"><div class="wrap" style="max-width:720px">
  <p class="mono">Book a call</p>
  <h1>Let's have a quick chat</h1>
  <p class="lede">Tell us a bit about your business and we'll call you back. No pressure, no hard sell.</p>
  <form class="form" id="form" novalidate>
    <div class="two">
      <label class="f">Your name<input type="text" name="name" autocomplete="name" required maxlength="120"></label>
      <label class="f">Business name<input type="text" name="business" autocomplete="organization" required maxlength="160"></label>
    </div>
    <div class="two">
      <label class="f">Email<input type="email" name="email" autocomplete="email" required maxlength="200"></label>
      <label class="f">Mobile<input type="tel" name="phone" autocomplete="tel" required maxlength="30"></label>
    </div>
    <div class="two">
      <label class="f">Your trade<select name="trade"><option value="">Choose one</option><option>Electrician</option><option>Plumber</option><option>Builder</option><option>Arborist</option><option>Landscaper</option><option>Painter</option><option>Carpenter</option><option>Other</option></select></label>
      <label class="f">Best time to call<select name="best_time"><option value="">Anytime</option><option>Morning</option><option>Lunchtime</option><option>Afternoon</option><option>After work</option></select></label>
    </div>
    <label class="f">Anything you'd like us to know? (optional)<input type="text" name="note" maxlength="500"></label>
    <div class="hp" aria-hidden="true"><label>Leave empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <p class="fine">We'll only use your details to call you back. See our <a href="privacy.html">privacy policy</a>.</p>
    <div id="msg" role="status" aria-live="polite" hidden></div>
    <button class="btn btn-primary" type="submit" id="go">Book my call</button>
  </form>
</div></main>
<footer><div class="wrap">
  <p><span data-cfg="businessName"></span> · <span data-cfg="abn"></span></p>
  <div class="flinks"><a href="index.html">Home</a><a href="terms.html">Terms and conditions</a><a href="privacy.html">Privacy</a></div>
</div></footer>
<script src="assets/config.js"></script>
<script src="assets/call.js"></script>
</body>
</html>
